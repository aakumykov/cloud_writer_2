plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

android {
    namespace 'com.github.aakumykov.cloud_writer_2_demo'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.github.aakumykov.cloud_writer_2_demo"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        viewBinding true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation libs.androidx.appcompat.v161
    implementation libs.androidx.core.ktx
    implementation libs.androidx.preference.ktx

    testImplementation libs.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit

    implementation 'com.github.aakumykov.file_lister_navigator_selector_2:file_lister_navigator_selector:21.1.0-alpha'
    implementation 'com.github.aakumykov.file_lister_navigator_selector_2:local_file_lister_navigator_selector:21.1.0-alpha'
    implementation 'com.github.aakumykov:storage_access_helper:3.0.0-alpha'
//    implementation 'com.github.aakumykov.cloud_authenticator:cloud_authenticator:0.0.11-alpha'
}